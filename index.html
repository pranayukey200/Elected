<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & High-Rank Metadata -->
    <title>ElectED | Global Election Intelligence Platform</title>
    <meta name="description" content="Interactive 3D election globe and AI-powered voter assistant. Empowering global democracy through data." />
    <meta name="keywords" content="elections, 3d map, election results, voter assistant, ai democracy" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elected-adcd4.web.app/" />
    <meta property="og:title" content="ElectED | Global Election Intelligence" />
    <meta property="og:description" content="Interactive 3D globe and AI assistant for the modern voter." />
    <meta property="og:image" content="https://elected-adcd4.web.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ElectED | Global Election Intelligence" />
    <meta name="twitter:description" content="Interactive 3D globe and AI assistant for the modern voter." />
    <meta name="twitter:image" content="https://elected-adcd4.web.app/og-image.png" />

    <!-- PWA Primary Metadata -->
    <meta name="theme-color" content="#05050A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.gstatic.com https://maps.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' https://api.groq.com https://generativelanguage.googleapis.com https://maps.googleapis.com https://www.google-analytics.com https://region1.google-analytics.com;
        img-src 'self' data: blob: https:;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <title>ElectED — Understand Your Vote</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Analytics 4
         Replace G-XXXXXXXXXX with your actual GA4 Measurement ID.
         Remove these two script tags if you don't have one. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', {
        anonymize_ip: true,
        cookie_flags: 'SameSite=None;Secure'
      });
    </script>
  </head>
  <body>
    <!-- No-JS fallback -->
    <noscript>
      <p style="text-align:center;font-family:sans-serif;padding:2rem;color:#e1e0cc;background:#0a0a0f">
        ElectED requires JavaScript to run. Please enable JavaScript in your browser.
      </p>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
