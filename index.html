<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A step-by-step guide to how elections work — from registration to results. Non-partisan election education platform." />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.gstatic.com https://maps.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' https://api.groq.com https://generativelanguage.googleapis.com https://maps.googleapis.com https://www.google-analytics.com https://region1.google-analytics.com;
        img-src 'self' data: blob: https:;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <title>ElectED — Understand Your Vote</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Google Analytics 4
         Replace G-XXXXXXXXXX with your actual GA4 Measurement ID.
         Remove these two script tags if you don't have one. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', {
        anonymize_ip: true,
        cookie_flags: 'SameSite=None;Secure'
      });
    </script>
  </head>
  <body>
    <!-- No-JS fallback -->
    <noscript>
      <p style="text-align:center;font-family:sans-serif;padding:2rem;color:#e1e0cc;background:#0a0a0f">
        ElectED requires JavaScript to run. Please enable JavaScript in your browser.
      </p>
    </noscript>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAj7J5xM5K3adSJIn-QoAjN8FbyGWJbNoM&libraries=marker&v=beta"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
